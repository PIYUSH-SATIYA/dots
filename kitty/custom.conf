background_opacity          0.7



## descrease font size
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0

## increase font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+kp_add change_font_size all +1.0


## include themes
# include ./'Github Dark.conf'

cursor_shape block
cursor_unfocused hollow
cursor_blink_interval 0

# Notify when a command finishes in an unfocused window
notify_on_cmd_finish unfocused

# Notify only for commands taking at least 10 seconds
notify_on_cmd_finish_slow_duration 10

# Duration for which the notification is displayed
notify_on_cmd_finish_duration 5
