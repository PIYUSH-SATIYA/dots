# Configuration


font_family                 JetBrainsMono Nerd Font
font_size                   10
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.7
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# include custom before matugen
include ./custom.conf

# # Include wallpaper colors
# include colors-wallust.conf
# include colors-matugen.conf
# # Remove the # signs from above two lines to include colors from the background too


# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
# include ./custom.conf

# watcher nvim-opacity.py

# add remote cotrol to open new tab in pwd with alias
allow_remote_control yes
shell_integration enabled

# # Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}


enable_audio_bell no



